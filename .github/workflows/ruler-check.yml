name: Ruler Configuration Check

on:
  pull_request:
    paths:
      - '.ruler/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx @intellectronica/ruler apply --dry-run --verbose